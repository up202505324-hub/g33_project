{% extends "base.html" %}
{% block title %}Login · GestorCloud{% endblock %}

{% block content %}
<div class="login-wrapper">
  <div class="login-box">
    <h2>🔐 Login</h2>
    <form method="POST" action="/chklogin">
      <div class="form-group">
        <label>Utilizador</label>
        <input type="text" name="user" value="{{ user }}" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      {% if resul %}
        <p style="color: red; font-size: 13px;">{{ resul }}</p>
      {% endif %}
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
