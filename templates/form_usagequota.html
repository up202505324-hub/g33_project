{% extends "base.html" %}
{% block title %}{{ 'Editar' if obj else 'Nova' }} UsageQuota · GestorCloud{% endblock %}

{% block content %}
<h2 class="page-title">{{ 'Editar' if obj else 'Nova' }} UsageQuota</h2>

<div class="card form-card">
  <div style="padding: 20px;">
    <form method="POST">
      <div class="form-row">
        <div class="form-group">
          <label>Provider</label>
          <select name="provider_id" required>
            {% for p in providers %}
              <option value="{{ p.id }}" {{ 'selected' if obj and obj._provider_id == p.id }}>
                #{{ p.id }} — {{ p.name }}
              </option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Datacenter</label>
          <select name="datacenter_id" required>
            {% for d in datacenters %}
              <option value="{{ d.id }}" {{ 'selected' if obj and obj._datacenter_id == d.id }}>
                #{{ d.id }} — {{ d.title }}
              </option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Data de Utilização</label>
          <input type="date" name="usage_date" value="{{ obj._usage_date if obj else '' }}" required>
        </div>
        <div class="form-group">
          <label>Custo (€)</label>
          <input type="number" step="0.01" name="cost" value="{{ obj._cost if obj else '' }}" required>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="javascript:history.back()" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
